<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Honeycomb hexagon grid icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a007"/>
      <stop offset="1" stop-color="#e07b00"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- central hexagon -->
  <polygon points="64,22 100,44 100,84 64,106 28,84 28,44" fill="url(#hex)" stroke="#ffd166" stroke-width="3"/>
  <!-- surrounding cells (six neighbors, partial) -->
  <polygon points="116,44 128,50 128,78 116,84" fill="#f2a007" opacity="0.35"/>
  <polygon points="12,44 0,50 0,78 12,84" fill="#f2a007" opacity="0.35"/>
  <polygon points="64,0 80,10 80,22 64,22 48,22 48,10" fill="#f2a007" opacity="0.35"/>
  <polygon points="64,128 80,118 80,106 64,106 48,106 48,118" fill="#f2a007" opacity="0.35"/>
  <!-- guitar-string detail on the hexagon -->
  <line x1="42" y1="66" x2="86" y2="66" stroke="#1a1a2e" stroke-width="3" opacity="0.55"/>
  <line x1="46" y1="78" x2="82" y2="78" stroke="#1a1a2e" stroke-width="3" opacity="0.55"/>
</svg>
