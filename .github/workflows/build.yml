name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize dependencies (submodule + patches)
        run: ./scripts/init-deps.sh
        shell: bash

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Honeycomb.sln

      - name: Build (Release)
        run: dotnet build Honeycomb.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Honeycomb.sln -c Release --no-build

      - name: Verify no WinForms/Registry leaks in shared projects
        if: runner.os == 'Linux'
        run: |
          if grep -rn "System.Windows.Forms\|Microsoft.Win32.Registry" src/Honeycomb.Application src/Honeycomb.App --include="*.cs" ; then
            echo "::error::Shared projects must not reference WinForms or the Windows Registry."
            exit 1
          fi
          echo "No WinForms/Registry references found in shared projects."

      - name: Verify Linux resource casing
        if: runner.os == 'Linux'
        run: |
          test -f "src/Honeycomb.App/List Files/Skeletons.txt"
          test -f "src/Honeycomb.App/List Files/SongCategories.txt"
          grep -rn "skeletons.txt" src/Honeycomb.Application --include="*.cs" && exit 1 || true
          grep -rn "songcategories.txt" src/Honeycomb.Application --include="*.cs" && exit 1 || true
          echo "Resource casing verified."

      - name: Publish Linux x64
        if: runner.os == 'Linux'
        run: ./scripts/publish.sh linux-x64

      - name: Publish Windows x64
        if: runner.os == 'Windows'
        run: |
          dotnet publish src/Honeycomb.App/Honeycomb.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish-win-x64
          Compress-Archive -Path artifacts/publish-win-x64 -DestinationPath artifacts/honeycomb-win-x64.zip

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-linux-x64
          path: artifacts/honeycomb-linux-x64.tar.gz

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-win-x64
          path: artifacts/honeycomb-win-x64.zip
