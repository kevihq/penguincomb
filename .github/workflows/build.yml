name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize dependencies (submodule + patches)
        run: ./scripts/init-deps.sh
        shell: bash

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PenguinComb.sln

      - name: Build (Release)
        run: dotnet build PenguinComb.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test PenguinComb.sln -c Release --no-build

      - name: Verify no WinForms/Registry leaks in shared projects
        if: runner.os == 'Linux'
        run: |
          if grep -rn "System.Windows.Forms\|Microsoft.Win32.Registry" src/PenguinComb.Application src/PenguinComb.App --include="*.cs" ; then
            echo "::error::Shared projects must not reference WinForms or the Windows Registry."
            exit 1
          fi
          echo "No WinForms/Registry references found in shared projects."

      - name: Verify Linux resource casing
        if: runner.os == 'Linux'
        run: |
          test -f "src/PenguinComb.App/List Files/Skeletons.txt"
          test -f "src/PenguinComb.App/List Files/SongCategories.txt"
          grep -rn "skeletons.txt" src/PenguinComb.Application --include="*.cs" && exit 1 || true
          grep -rn "songcategories.txt" src/PenguinComb.Application --include="*.cs" && exit 1 || true
          echo "Resource casing verified."

      - name: Publish Linux x64
        if: runner.os == 'Linux'
        run: ./scripts/publish.sh linux-x64

      - name: Build Linux AppImage (single-file)
        if: runner.os == 'Linux'
        run: ./scripts/build-appimage.sh

      - name: Verify AppImage integrity
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(ls artifacts/PenguinComb-*-x86_64.AppImage | head -1)
          test -n "$APPIMAGE"
          MAGIC=$(dd if="$APPIMAGE" bs=1 skip=8 count=3 2>/dev/null)
          if [ "$MAGIC" != "AI" ]; then
            echo "::error::Invalid AppImage magic bytes"
            exit 1
          fi
          test -x "$APPIMAGE"
          echo "AppImage verified: $APPIMAGE"

      - name: Publish Windows x64
        if: runner.os == 'Windows'
        run: |
          dotnet publish src/PenguinComb.App/PenguinComb.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish-win-x64
          Compress-Archive -Path artifacts/publish-win-x64 -DestinationPath artifacts/penguincomb-win-x64.zip

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: penguincomb-linux-x64
          path: |
            artifacts/penguincomb-linux-x64.tar.gz
            artifacts/PenguinComb-*-x86_64.AppImage

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: penguincomb-win-x64
          path: artifacts/penguincomb-win-x64.zip
